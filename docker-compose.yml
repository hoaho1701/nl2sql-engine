services:
  postgres:
    image: postgres:17
    container_name: text2sql-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: text2sql
      POSTGRES_PASSWORD: text2sql
      POSTGRES_DB: text2sql
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: