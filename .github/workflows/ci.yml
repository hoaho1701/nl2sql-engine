name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: text2sql
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: text2sql
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_READONLY_USER: readonly_app
      POSTGRES_READONLY_PASSWORD: changeme
      OLLAMA_BASE_URL: http://localhost:11434/v1
      OLLAMA_SQL_MODEL: qwen2.5-coder:7b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      CHROMA_PERSIST_DIR: ./chroma_data
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: text2sql
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: text2sql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U text2sql -d text2sql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run python -m tests.prepare_database
        env:
          ALLOW_DROP_TABLES: "1"
      - run: uv run python -m app.create_readonly_role
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t nl2sql-backend .
